<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>심플 To-Do List | 기초 학습자용</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 메인 애플리케이션 래퍼 -->
  <div class="app-wrapper">
    <!-- 헤더 영역 -->
    <header class="app-header">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px;">
        <div class="badge">Beginner Friendly</div>
        <a href="/game" style="color: #6366f1; text-decoration: none; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 999px; background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.25); transition: all 0.2s;" onmouseover="this.style.background='rgba(99, 102, 241, 0.2)'" onmouseout="this.style.background='rgba(99, 102, 241, 0.1)'">🕹️ 테트리스 게임 바로가기 →</a>
      </div>
      <h1 class="app-title">Simple To-Do List</h1>
      <p class="app-subtitle">기초 학습자를 위한 단일 사용자 할 일 관리 앱</p>
    </header>

    <section class="login-card" aria-labelledby="login-title">
      <div class="login-heading">
        <span class="login-kicker">SIGN IN</span>
        <h2 id="login-title">다시 만나 반가워요</h2>
        <p>로그인 화면 미리보기</p>
      </div>

      <form class="login-form" aria-describedby="login-preview-note">
        <label class="login-label" for="login-id">ID</label>
        <input
          class="login-input"
          type="text"
          id="login-id"
          name="login-id"
          placeholder="아이디를 입력하세요"
          autocomplete="username"
        >

        <label class="login-label" for="login-password">Password</label>
        <input
          class="login-input"
          type="password"
          id="login-password"
          name="login-password"
          placeholder="비밀번호를 입력하세요"
          autocomplete="current-password"
        >

        <button class="login-btn" type="button" disabled>로그인</button>
        <p class="login-note" id="login-preview-note" role="note">
          인증 연동이 없어 로그인, 로그아웃 및 접근 보호는 동작하지 않습니다.
        </p>
      </form>
    </section>

    <!-- 메인 카드 컨테이너 -->
    <main class="todo-card">
      <!-- 1. 할 일 입력 폼 (Create) -->
      <form id="todo-form" class="todo-form" autocomplete="off">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="todo-input" 
            class="todo-input" 
            placeholder="새로운 할 일을 입력하세요..." 
            maxlength="150"
            aria-label="할 일 입력"
          >
        </div>
        <button type="submit" id="add-btn" class="add-btn" aria-label="할 일 추가">
          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>추가</span>
        </button>
      </form>

      <!-- 2. 할 일 목록 영역 (Read / Toggle / Delete) -->
      <section class="todo-section">
        <!-- 동적으로 할 일 항목들이 추가되는 UL 리스트 -->
        <ul id="todo-list" class="todo-list" aria-label="할 일 목록"></ul>

        <!-- 할 일이 없을 때 표시되는 빈 화면 (Empty State) -->
        <div id="empty-state" class="empty-state">
          <div class="empty-icon-wrapper">
            <svg class="empty-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </div>
          <p class="empty-title">등록된 할 일이 없습니다</p>
          <p class="empty-desc">위 입력창에 첫 번째 할 일을 작성하고 추가해보세요!</p>
        </div>
      </section>

      <!-- 3. 상태 요약 정보 (Count Summary) -->
      <footer class="card-footer">
        <div class="summary-text" id="todo-summary">
          총 <strong id="total-count">0</strong>개 중 <strong id="completed-count">0</strong>개 완료
        </div>
      </footer>
    </main>

    <!-- 푸터 안내 -->
    <footer class="app-footer">
      <p>단방향 데이터 흐름: <code>Event → State 변경 → Storage 저장 → 화면 Render</code></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
